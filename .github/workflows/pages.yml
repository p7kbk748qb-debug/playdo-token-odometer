name: Project website
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static public site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
