name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Accounting and persistence tests
        shell: powershell
        run: ./test.ps1
      - name: Native application
        shell: powershell
        run: ./build.ps1
      - name: Appearance and layout checks
        shell: powershell
        run: ./tools/verify-appearance.ps1
      - name: Quality-of-life checks
        shell: powershell
        run: |
          if (Test-Path ./test-qol.ps1) { ./test-qol.ps1 }
      - name: Portable package with public files only
        shell: powershell
        run: ./package.ps1 -SkipBuild
      - name: Extracted portable application smoke test
        shell: powershell
        run: ./tools/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PlayDo-Token-Odometer-0.2.0-windows-x64
          path: |
            release/PlayDo-Token-Odometer-0.2.0-windows-x64.zip
            release/PlayDo-Token-Odometer-0.2.0-windows-x64.zip.sha256
          if-no-files-found: error
